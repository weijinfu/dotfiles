# ══════════════════════════════════════════════════════════════
# Mihomo 最小可用配置
# ══════════════════════════════════════════════════════════════

mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false
find-process-mode: strict
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
keep-alive-interval: 15
keep-alive-idle: 15
disable-keep-alive: false
external-controller: 127.0.0.1:9090
external-ui: ui

profile:
  store-selected: true
  store-fake-ip: true

geox-url:
  geoip:   "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"

tun:
  enable: true
  stack: mixed
  dns-hijack:
    - any:53
    - tcp://any:53

# ── DNS ────────────────────────────────────────────────────────
dns:
  enable: true
  cache-algorithm: arc
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  respect-rules: false
  listen: 0.0.0.0:1053
  ipv6: false
  default-nameserver:
    - 223.5.5.5
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # fake-ip-range6: fdfe:dcba:9876::1/64
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - '*.lan'
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback:
    - tls://8.8.4.4
    - tls://1.1.1.1
  proxy-server-nameserver:
    - https://doh.pub/dns-query
  proxy-server-nameserver-policy:
    'www.yournode.com': '114.114.114.114'
  direct-nameserver:
    - system
  direct-nameserver-follow-policy: false
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
    ipcidr:
      - 240.0.0.0/4
    domain:
      - '+.google.com'
      - '+.facebook.com'
      - '+.youtube.com'

# ── 嗅探 ──────────────────────────────────────────────────────
sniffer:
  enable: true
  sniff:
    HTTP:  { ports: [80, 8080-8880], override-destination: true }
    TLS:   { ports: [443, 8443] }
    QUIC:  { ports: [443, 8443] }

# ── 代理节点（填你自己的节点或改用 proxy-providers）──────────
proxies:
- name: googlecloud                      # 可以自定义节点名称
  type: vless
  server: 
  port: 443
  uuid:     # 自定义 UUID
  tls: true
  udp: true
  flow: xtls-rprx-vision
  servername: www.apple.com.cn
  reality-opts:
    public-key: 
    short-id: 

# ── 机场订阅（有订阅的填这里，无订阅可删掉）──────────────────
proxy-providers:
  provider1:
    type: http
    url: ""
    interval: 86400
    path: ./proxy_providers/provider1.yaml
    skip-cert-verify: true
    health-check: { enable: true, url: "https://www.gstatic.com/generate_204", interval: 300, lazy: true }

proxy-groups:
  - name: VPS
    type: select
    proxies: []

  - name: PROXY
    type: select
    proxies: ["VPS", "HongKong", "Taiwan", "Singapore", "USA", "Japan", "Other-Regions"]

  - name: Others
    type: select
    proxies: [DIRECT, PROXY]

  - name: 🎮 GAME
    type: select
    proxies: [DIRECT, "VPS", "HongKong", "Taiwan", "Singapore", "USA", "Japan", "Other-Regions"]

  - name: 📹 Netflix
    type: select
    proxies: ["VPS", "HongKong", "Taiwan", "Singapore", "USA", "Japan", "Other-Regions"]

  - name: 🤖 AI
    type: select
    proxies: ["VPS", "HongKong", "Taiwan", "Singapore", "USA", "Japan", "Other-Regions"]

  - name: 🍎 Apple
    type: select
    proxies: [DIRECT, "VPS", "HongKong", "Taiwan", "Singapore", "USA", "Japan", "Other-Regions"]

  - name: HongKong
    type: url-test
    include-all: true
    exclude-type: direct
    filter: "(?i)港|hk|hongkong|hong kong"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  - name: Taiwan
    type: url-test
    include-all: true
    exclude-type: direct
    filter: "(?i)台|tw|taiwan"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  - name: Singapore
    type: url-test
    include-all: true
    exclude-type: direct
    filter: "(?i)新|sg|singapore"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  - name: USA
    type: url-test
    include-all: true
    exclude-type: direct
    filter: "(?i)美|us|usa|america"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  - name: Japan
    type: url-test
    include-all: true
    exclude-type: direct
    filter: "(?i)日|jp|japan"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  - name: Other-Regions
    type: select
    include-all: true
    exclude-type: direct
    exclude-filter: "(?i)港|hk|hongkong|hong kong|台|tw|taiwan|新|sg|singapore|美|us|usa|america|日|jp|japan"

rules:
  # ===== 游戏 =====
  - RULE-SET,category-games,🎮 GAME

  # ===== Netflix =====
  - RULE-SET,netflix,📹 Netflix

  # ===== 流媒体 =====
  # ===== AI =====
  - RULE-SET,category-ai,🤖 AI

  # ===== Apple =====
  - RULE-SET,apple,🍎 Apple

  # ===== 其他国外 =====
  - RULE-SET,geolocation-!cn,PROXY

  # ===== 国内 =====
  - RULE-SET,cn,DIRECT
  - GEOIP,CN,DIRECT

  # ===== 兜底 =====
  - MATCH,Others

rule-providers:

  # ===== 游戏 =====
  category-games:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/category-games-!cn.yaml
    path: ./ruleset/category-games.yaml
    interval: 86400
    #
  # ===== Netflix =====
  netflix:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/netflix.yaml
    path: ./ruleset/netflix.yaml
    interval: 86400

  # ===== 流媒体 =====
  #
  # ===== AI =====
  category-ai:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/category-ai-!cn.yaml
    path: ./ruleset/category-ai.yaml
    interval: 86400

  # ===== Apple =====
  apple:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/apple.yaml
    path: ./ruleset/apple.yaml
    interval: 86400

  # ===== 基础 =====
  cn:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/cn.yaml
    path: ./ruleset/cn.yaml
    interval: 86400

  geolocation-!cn:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/geolocation-!cn.yaml
    path: ./ruleset/geolocation.yaml
    interval: 86400
