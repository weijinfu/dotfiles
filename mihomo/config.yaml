# ══════════════════════════════════════════════════════════════
# Mihomo 最小可用配置
# ══════════════════════════════════════════════════════════════

mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false
find-process-mode: strict
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
keep-alive-interval: 15
keep-alive-idle: 15
disable-keep-alive: false
external-controller: 127.0.0.1:9090
external-ui: ui

profile:
  store-selected: true
  store-fake-ip: true

geox-url:
  geoip:   "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"

tun:
  enable: true
  stack: mixed
  dns-hijack:
    - any:53
    - tcp://any:53

# ── DNS ────────────────────────────────────────────────────────
dns:
  enable: true
  cache-algorithm: arc
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  respect-rules: false
  listen: 0.0.0.0:1053
  ipv6: false
  default-nameserver:
    - 223.5.5.5
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # fake-ip-range6: fdfe:dcba:9876::1/64
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - '*.lan'
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback:
    - tls://8.8.4.4
    - tls://1.1.1.1
  proxy-server-nameserver:
    - https://doh.pub/dns-query
  proxy-server-nameserver-policy:
    'www.yournode.com': '114.114.114.114'
  direct-nameserver:
    - system
  direct-nameserver-follow-policy: false
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
    ipcidr:
      - 240.0.0.0/4
    domain:
      - '+.google.com'
      - '+.facebook.com'
      - '+.youtube.com'

# ── 嗅探 ──────────────────────────────────────────────────────
sniffer:
  enable: true
  sniff:
    HTTP:  { ports: [80, 8080-8880], override-destination: true }
    TLS:   { ports: [443, 8443] }
    QUIC:  { ports: [443, 8443] }

# ── 代理节点（填你自己的节点或改用 proxy-providers）──────────
proxies:
- name: googlecloud                      # 可以自定义节点名称
  type: vless
  server: 
  port: 443
  uuid:     # 自定义 UUID
  tls: true
  udp: true
  flow: xtls-rprx-vision
  servername: www.apple.com.cn
  reality-opts:
    public-key: 
    short-id: 

# ── 机场订阅（有订阅的填这里，无订阅可删掉）──────────────────
proxy-providers:
  provider1:
    type: http
    url: ""
    interval: 86400
    path: ./proxy_providers/provider1.yaml
    skip-cert-verify: true
    health-check: { enable: true, url: "https://www.gstatic.com/generate_204", interval: 300, lazy: true }

# ── 代理组 ────────────────────────────────────────────────────
proxy-groups:
  - name: "国外流量"
    type: select
    use: ["provider1"]
    proxies: ["googlecloud"]

  - name: "国内直连"
    type: select
    proxies: [DIRECT]

  - name: 自动选择
    type: url-test
    use: ["provider1"]
    proxies: ["googlecloud"]
    interval: 300
    tolerance: 50

  - name: 其他流量
    type: select
    proxies: ["国内直连", "国外流量", "自动选择"]

  - name: HongKong
    type: select
    # type: url-test
    include-all: true
    exclude-type: direct
    filter: "(?i)港|hk|hongkong|hong kong"
    # url: "https://www.gstatic.com/generate_204"
    # interval: 300
    # tolerance: 50

  - name: Taiwan
    type: select
    # type: url-test
    include-all: true
    exclude-type: direct
    filter: "(?i)台|tw|taiwan"
    # url: "https://www.gstatic.com/generate_204"
    # interval: 300
    # tolerance: 50

  - name: Singapore
    type: select
    # type: url-test
    include-all: true
    exclude-type: direct
    filter: "(?i)新|sg|singapore"
    # url: "https://www.gstatic.com/generate_204"
    # interval: 300
    # tolerance: 50

  - name: USA
    type: select
    # type: url-test
    include-all: true
    exclude-type: direct
    filter: "(?i)美|us|usa|america"
    # url: "https://www.gstatic.com/generate_204"
    # interval: 300
    # tolerance: 50

  - name: Japan
    type: select
    # type: url-test
    include-all: true
    exclude-type: direct
    filter: "(?i)日|jp|japan"
    # url: "https://www.gstatic.com/generate_204"
    # interval: 300
    # tolerance: 50

  - name: UK
    type: select
    # type: url-test
    include-all: true
    exclude-type: direct
    filter: "(?i)英|uk|united kingdom|britain"
    # url: "https://www.gstatic.com/generate_204"
    # interval: 300
    # tolerance: 50

  - name: Other
    type: select
    # type: url-test
    include-all: true
    exclude-type: direct
    exclude-filter: "(?i)港|hk|hongkong|hong kong|台|tw|taiwan|新|sg|singapore|美|us|usa|america|日|jp|japan|英|uk|united kingdom|britain"
    # url: "https://www.gstatic.com/generate_204"
    # interval: 300
    # tolerance: 50

# ── 路由规则 ──────────────────────────────────────────────────
rule-providers:
  reject:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt"
    path: ./ruleset/reject.yaml
    interval: 86400

  icloud:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/icloud.txt"
    path: ./ruleset/icloud.yaml
    interval: 86400

  apple:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/apple.txt"
    path: ./ruleset/apple.yaml
    interval: 86400

  google:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/google.txt"
    path: ./ruleset/google.yaml
    interval: 86400

  proxy:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt"
    path: ./ruleset/proxy.yaml
    interval: 86400

  direct:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt"
    path: ./ruleset/direct.yaml
    interval: 86400

  private:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt"
    path: ./ruleset/private.yaml
    interval: 86400

  gfw:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/gfw.txt"
    path: ./ruleset/gfw.yaml
    interval: 86400

  tld-not-cn:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/tld-not-cn.txt"
    path: ./ruleset/tld-not-cn.yaml
    interval: 86400

  telegramcidr:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/telegramcidr.txt"
    path: ./ruleset/telegramcidr.yaml
    interval: 86400

  cncidr:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt"
    path: ./ruleset/cncidr.yaml
    interval: 86400

  lancidr:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt"
    path: ./ruleset/lancidr.yaml
    interval: 86400

  applications:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/applications.txt"
    path: ./ruleset/applications.yaml
    interval: 86400
## 规则
rules:
  - RULE-SET,applications,DIRECT
  - DOMAIN,clash.razord.top,DIRECT
  - DOMAIN,yacd.haishan.me,DIRECT
  - RULE-SET,private,DIRECT
  - RULE-SET,reject,REJECT
  - RULE-SET,icloud,DIRECT
  - RULE-SET,apple,DIRECT
  - RULE-SET,google,国外流量
  - RULE-SET,proxy,国外流量
  - RULE-SET,direct,DIRECT
  - RULE-SET,lancidr,DIRECT
  - RULE-SET,cncidr,DIRECT
  - RULE-SET,telegramcidr,国外流量
  - GEOIP,LAN,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,其他流量
